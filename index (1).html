<style>
/* Layout: una sola columna tipo app móvil; cada paso es una tarjeta con la mascota guiando */
:root{
  --bg:#eef5fc; --surface:#ffffff; --surface-2:#f5f9fe; --ink:#10294a; --muted:#566a82; --line:#d6e4f3;
  --blue:#2a6db8; --blue-ink:#0d4a92; --blue-soft:#e3effd; --green:#7e9e14; --green-soft:#f1f7dc;
  --ok:#2f8f4e; --ok-soft:#e3f5e9; --mid:#b7791f; --mid-soft:#fdf3dc; --high:#c2410c; --high-soft:#fde8dc; --crit:#b4232f; --crit-soft:#fde2e4;
  --wa:#1f9d55; --purple:#6b2fa0; --purple-soft:#f2e9fa;
  --display:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1625; --surface:#122238; --surface-2:#172b45; --ink:#e7f0fb; --muted:#9db1c9; --line:#25405f;
  --blue:#5aa2ff; --blue-ink:#a8cdff; --blue-soft:#17345a; --green:#b5d23a; --green-soft:#2a3512;
  --ok:#6fd393; --ok-soft:#163a26; --mid:#f2c063; --mid-soft:#3b2f12; --high:#ff9a62; --high-soft:#43230f; --crit:#ff7a85; --crit-soft:#46171c;
  --wa:#3ccf7a; --purple:#c9a2f0; --purple-soft:#2c1a40; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b1625; --surface:#122238; --surface-2:#172b45; --ink:#e7f0fb; --muted:#9db1c9; --line:#25405f;
  --blue:#5aa2ff; --blue-ink:#a8cdff; --blue-soft:#17345a; --green:#b5d23a; --green-soft:#2a3512;
  --ok:#6fd393; --ok-soft:#163a26; --mid:#f2c063; --mid-soft:#3b2f12; --high:#ff9a62; --high-soft:#43230f; --crit:#ff7a85; --crit-soft:#46171c;
  --wa:#3ccf7a; --purple:#c9a2f0; --purple-soft:#2c1a40; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.app{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{background:#fff;border-radius:14px;padding:8px 12px;display:flex;align-items:center;border:1px solid var(--line)}
.logo img{height:48px;width:auto;display:block}
.tag{font-family:var(--display);font-weight:700;color:var(--green);font-size:15px;line-height:1.2;text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,8vw,44px);font-weight:800;color:var(--blue)}
h1 .g{color:var(--green)}
h2{font-size:26px;font-weight:700;color:var(--blue-ink)}
h3{font-size:19px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.guide{display:flex;align-items:flex-end;gap:12px}
.guide img{width:128px;height:auto;border-radius:20px;flex:none;max-width:40%}
.bubble{position:relative;background:var(--blue-soft);color:var(--blue-ink);border-radius:18px 18px 18px 4px;padding:12px 14px;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;margin-bottom:18px;min-width:0}
.hero-img{width:100%;max-width:240px;align-self:center;border-radius:24px;display:block}
.hero{display:flex;flex-direction:column;gap:16px}
.heart-msg{margin:0;padding:18px 20px;border-radius:20px;background:linear-gradient(135deg,var(--blue-soft),var(--green-soft));display:flex;flex-direction:column;gap:10px;font-size:16.5px;color:var(--ink)}
.heart-msg .sign{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.25;color:var(--blue-ink)}
.tagwrap{display:flex;align-items:center;gap:8px}
.tagicon{width:58px;height:auto;border-radius:14px;background:#fff}

.btn{appearance:none;border:0;border-radius:999px;padding:14px 22px;font:800 16px/1.2 var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s ease, background .12s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.btn-primary{background:var(--blue);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#06203f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#06203f}}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--blue);border:2px solid var(--line)}
.btn-wa{background:var(--wa);color:#fff;font-size:17px;padding:16px 22px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--blue);flex:none}
.consent-text{background:var(--surface-2);border-radius:14px;padding:14px 16px;font-size:15px;display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;border:1px solid var(--line)}
.consent-text ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg label{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.seg b{font-size:15px}
.fields{display:grid;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:14px}
.field input,.field select{font:16px var(--body);padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.progress{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:var(--blue-soft);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .35s ease}
.plabel{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700}
.stem{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.q{font-family:var(--display);font-size:clamp(22px,5.5vw,26px);font-weight:700;line-height:1.2;color:var(--ink);text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 16px var(--body);cursor:pointer;transition:border-color .12s,background .12s}
.opt .em{font-size:28px;line-height:1;flex:none}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.alert{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--crit-soft);border:1.5px solid var(--crit)}
.alert h3{color:var(--crit)}
.lines{display:grid;gap:8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.line b{font-family:var(--display);font-size:20px;color:var(--ink)}
.level{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.level .pill{align-self:flex-start;border-radius:99px;padding:4px 12px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--bg)}
.lv-ok{background:var(--ok-soft)} .lv-ok .pill{background:var(--ok)}
.lv-mid{background:var(--mid-soft)} .lv-mid .pill{background:var(--mid)}
.lv-high{background:var(--high-soft)} .lv-high .pill{background:var(--high)}
.lv-crit{background:var(--crit-soft)} .lv-crit .pill{background:var(--crit)}
.scales{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scale{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.scale .n{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue)}
.scale .n small{font-size:15px;color:var(--muted);font-weight:700}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.route{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--surface);transition:transform .12s,border-color .12s;min-width:0}
.route:hover{transform:translateY(-2px);border-color:var(--blue)}
.route:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.route-psi{grid-column:1/-1;border-color:var(--purple)}
.route-psi:hover{border-color:var(--purple)}
.rimg{background:#fff;display:flex;align-items:center;justify-content:center;padding:10px;height:120px}
.route-psi .rimg{height:150px}
.rimg img{max-height:100%;max-width:100%;object-fit:contain}
.rlab{display:flex;flex-direction:column;gap:2px;padding:10px 12px;text-align:center;border-top:1px solid var(--line)}
.rlab b{font-family:var(--display);font-size:18px;line-height:1.2}
.route-psi .rlab{background:var(--purple-soft)} .route-psi .rlab b{color:var(--purple)}
.rlab span{font-size:13px;color:var(--muted)}
.route.off{opacity:.55;pointer-events:none}
.qk{color:var(--blue-ink)}
.preview{white-space:pre-wrap;font-size:13.5px;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:12px;max-height:220px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.contact b{font-variant-numeric:tabular-nums;user-select:all}
.toast{font-size:13px;color:var(--ok);font-weight:700;min-height:1em}
footer{font-size:13px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:4px}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar span{transition:none}}
@media (max-width:420px){.card{padding:18px}.guide img{width:104px}.scales{grid-template-columns:1fr}.rimg{height:96px}.route-psi .rimg{height:130px}.seg{grid-template-columns:1fr}}
</style>

function welcome(){S.step="welcome";render(`
  <h1>Hablemos de <span class="g">Corazón</span></h1>
  <p class="muted" style="font-size:18px">Un espacio para cuidar lo que sientes.</p>

      <p>Detenerte a preguntarte <b>cómo estás</b> es un acto de valentía y de amor propio. Hacerlo con frecuencia te permite darte cuenta a tiempo y pedir ayuda antes de que el peso sea mayor.</p>

  const q=Q[i],c=CHEER[i];
  render(`
  <div class="progress"><div class="plabel"><span>Pregunta ${i+1} de ${total}</span><span>${q.s==="phq"?"Estado de ánimo":"Preocupación y nervios"}</span></div><div class="bar"><span style="width:${(i/total)*100}%"></span></div></div>
  ${c?guide(c[0],c[1]):""}
  <p class="q">${PRE}<span class="qk">${q.t}</span></p>
  <div class="opts">${OPTS.map((o,v)=>`<button class="opt ${S.ans[i]===v?"sel":""}" data-v="${v}"><span class="em">${o[0]}</span>${o[1]}</button>`).join("")}</div>
  <div class="row"><button class="btn btn-ghost" id="back">Anterior</button></div>`);
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const v=+b.dataset.v;S.ans[i]=v;b.classList.add("sel");
    setTimeout(()=>{ if(q.risk&&v>0&&!S.riskShown){S.riskShown=true;return riskStop()} S.i++;question()},220)});
  $("#back").onclick=()=>{if(i===0)consent();else{S.i--;question()}};
}

function riskStop(){S.step="risk";T({alerta:true});render(`
  ${guide("tabla","Gracias por contármelo. No estás solo/a.")}
  <div class="alert">
    <h3>Queremos acompañarte ahora</h3>
    <p>Lo que sientes es importante y tiene ayuda. Te pedimos que hables hoy mismo con alguien. Puedes escribirle ya a la psicóloga de la clínica:</p>
    ${routes(urgentMsg(),"Escribir ahora a la psicóloga")}
    <div class="lines">
      <div class="line"><span>Línea nacional de salud mental, 24 horas</span><b>192 opción 4</b></div>
      <div class="line"><span>Emergencias</span><b>123</b></div>
    </div>
    <p class="small">Si sientes que puedes hacerte daño en este momento, llama al 123 o acude a urgencias. Busca a una persona de confianza y no te quedes solo/a.</p>
  </div>
  <p class="muted small">Puedes terminar la evaluación para que la psicóloga tenga más información.</p>
  <button class="btn btn-primary" id="cont">Continuar con la evaluación</button>`);
  $("#cont").onclick=()=>{S.i=9;question()};
}

function funcQ(){T({paso:19,etapa:"Pregunta 17 de 17"});render(`
  <div class="progress"><div class="plabel"><span>Pregunta 17 de 17</span><span>Tu día a día</span></div><div class="bar"><span style="width:${16/17*100}%"></span></div></div>
  ${guide("pulgar",CHEER[16][1])}
  <p class="q">Lo que marcaste, ¿qué tan difícil te ha hecho trabajar, atender tu casa o llevarte bien con otras personas?</p>
  <div class="opts">${FUNC.map((o,v)=>`<button class="opt ${S.func===v?"sel":""}" data-v="${v}"><span class="em">${o[0]}</span>${o[1]}</button>`).join("")}</div>
  <div class="row"><button class="btn btn-ghost" id="back">Anterior</button></div>`);
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.func=+b.dataset.v;b.classList.add("sel");setTimeout(result,220)});
  $("#back").onclick=()=>{S.i=15;question()};
}

function who(){return S.anon?"Participante anónimo/a":`${S.name||"Sin nombre"}${S.area?" · "+S.area:""}`}
function topSymptoms(){return Q.map((q,i)=>({q,v:S.ans[i]})).filter(x=>x.v>=2).map(x=>`• ${x.q.k} (${OPTS[x.v][1].toLowerCase()})`)}
function interp(){
  const p=sum("phq"),g=sum("gad"),out=[];
  if(p>=5) out.push(`indicadores compatibles con sintomatología depresiva ${phqBand(p)}`);
  if(g>=5) out.push(`indicadores compatibles con sintomatología ansiosa ${gadBand(g)}`);
  return out.length?out.join("; "):"sin indicadores relevantes de depresión o ansiedad";
}
function fullMsg(){
  const p=sum("phq"),g=sum("gad"),L=level(),top=topSymptoms();
  return [`🔔 *HABLEMOS DE CORAZÓN · Solicitud de acompañamiento*`,
  `Para: ${PSI}`,`Fecha: ${now()}`,``,
  `👤 ${who()}`,
  !S.anon&&S.phone?`📱 Celular: ${S.phone}`:null,
  !S.anon?`📞 Prefiere: ${S.pref}`:null,``,
  `🚦 *Nivel: ${L.name.toUpperCase()}*`,
  `• PHQ-9 (ánimo): ${p}/27, ${phqBand(p)}`,
  `• GAD-7 (ansiedad): ${g}/21, ${gadBand(g)}`,
  `• Ideación de muerte o autolesión (ítem 9): ${(S.ans[8]||0)>0?"SÍ, "+OPTS[S.ans[8]][1].toLowerCase()+" ⚠️":"No"}`,
  `• Afectación en su vida diaria: ${S.func!=null?FUNC[S.func][1]:"sin dato"}`,``,
  `🩺 Impresión de tamizaje: ${interp()}.`,
  top.length?`\n*Síntomas más frecuentes:*\n${top.join("\n")}`:null,``,
  `✅ Consentimiento informado aceptado el ${S.consentAt}.`,
  `_Resultado de tamizaje autoaplicado. No constituye diagnóstico; requiere valoración profesional._`
  ].filter(x=>x!==null).join("\n");
}
function urgentMsg(){return [`🚨 *HABLEMOS DE CORAZÓN · ALERTA PRIORITARIA*`,`Para: ${PSI}`,`Fecha: ${now()}`,``,`👤 ${who()}`,!S.anon&&S.phone?`📱 Celular: ${S.phone}`:null,``,
  `La persona respondió afirmativamente a pensamientos de muerte o de hacerse daño (PHQ-9 ítem 9: ${OPTS[S.ans[8]][1].toLowerCase()}).`,`Necesito hablar con alguien. Por favor contáctame lo antes posible.`,``,`✅ Consentimiento informado aceptado el ${S.consentAt}.`].filter(x=>x!==null).join("\n")}
function sstMsg(){return `Hola, vengo de la página Hablemos de Corazón de Corposalud.
¿Quisiera orientación sobre las líneas de ayuda en salud mental de la ARL Colmena?`}
function routes(psiMsg,psiTitle){
  const sstOk=!!SST_WA;
  return `<div class="routes">
  <a class="route route-psi" href="${waLink(psiMsg)}" target="_blank" rel="noopener"><span class="rimg"><img src="${LOGO.psi}" alt="Logo de la psicóloga Erika Patricia Salas González"></span><span class="rlab"><b>${psiTitle}</b><span>${PSI} · WhatsApp con tu resumen</span></span></a>
  <a class="route" href="${GLIA}" target="_blank" rel="noopener"><span class="rimg"><img src="${LOGO.glia}" alt="Logo de GLIA, Plataforma Integral de Atención en Salud Mental"></span><span class="rlab"><b>Plataforma GLIA</b><span>Instituto Departamental de Salud de Nariño</span></span></a>
  <a class="route${sstOk?"":" off"}" ${sstOk?`href="${waLink(sstMsg(),SST_WA)}" target="_blank" rel="noopener"`:'aria-disabled="true"'}><span class="rimg"><img src="${LOGO.sst}" alt="Logo del Sistema de Gestión de Seguridad y Salud en el Trabajo"></span><span class="rlab"><b>Orientación ARL</b><span>${sstOk?"Líneas de ayuda ARL Colmena con SST":"Próximamente"}</span></span></a>
  </div>`}
function waLink(t,n=WA){return `https://wa.me/${n}?text=${encodeURIComponent(t)}`}

const TIPS={
 ok:["Sigue cuidando tus rutinas de sueño, comida y descanso.","Mantén espacios con las personas que te hacen bien.","Haz pausas activas cortas durante la jornada."],
 mid:["Prueba la respiración 4-4-6: inhala 4 segundos, sostén 4, exhala 6. Repite 5 veces.","Duerme y come en horarios regulares, y reduce la cafeína en la tarde.","Habla con alguien de confianza sobre lo que te preocupa.","Una conversación con la psicóloga puede ayudarte a ordenar lo que sientes."],
 high:["Te recomendamos hablar con la psicóloga esta semana.","Cuéntale a una persona de confianza cómo te sientes.","Evita el alcohol y otras sustancias para manejar el malestar.","Date permiso de bajar el ritmo: prioriza lo esencial."],
 crit:["Por favor escribe hoy a la psicóloga. Queremos acompañarte.","Si sientes que puedes hacerte daño, llama al 123 o a la línea 192 opción 4.","No te quedes solo/a: busca a alguien de confianza ahora."]
};

function result(){S.step="result";
  const p=sum("phq"),g=sum("gad"),L=level(),msg=fullMsg();
  T({paso:20,etapa:"Resultado",termino:true,nivel:L.name,phq:p,gad:g,alerta:(S.ans[8]||0)>0});
  const cheerTxt={ok:"¡Qué bien! Sigue cuidándote.",mid:"Gracias por tomarte este tiempo. Aquí estamos.",high:"Hablar también es una forma de cuidarte.",crit:"Recuerda levantar la mano y pedir ayuda. Estamos contigo."}[L.k];
  render(`
  ${guide(L.img,cheerTxt)}
  <h2>Tu resultado</h2>
  <div class="level lv-${L.k}"><span class="pill">${L.name}</span>
    <p>${{ok:"Tus respuestas no muestran señales importantes de malestar emocional en estas dos semanas.",mid:"Tus respuestas muestran algunas señales de malestar emocional. Es un buen momento para cuidarte y, si quieres, conversar.",high:"Tus respuestas muestran un malestar emocional importante. Te recomendamos recibir acompañamiento.",crit:"Tus respuestas indican que necesitas acompañamiento pronto. No tienes que pasar por esto solo/a."}[L.k]}</p></div>
  <div class="scales">
    <div class="scale"><span class="small muted">Estado de ánimo · PHQ-9</span><span class="n">${p}<small> / 27</small></span><span class="small">Intensidad ${phqBand(p)}</span></div>
    <div class="scale"><span class="small muted">Ansiedad · GAD-7</span><span class="n">${g}<small> / 21</small></span><span class="small">Intensidad ${gadBand(g)}</span></div>
  </div>
  <h3>Recomendaciones para ti</h3>
  <ul class="tips">${TIPS[L.k].map(t=>`<li>${t}</li>`).join("")}</ul>
  ${L.k==="crit"?`<div class="lines"><div class="line"><span>Línea nacional de salud mental, 24 horas</span><b>192 opción 4</b></div><div class="line"><span>Emergencias</span><b>123</b></div></div>`:""}
  <h3>${L.k==="ok"?"¿Quieres hablar de todos modos?":"Recibe atención personalizada"}</h3>
  <p class="small muted">Elige a dónde quieres acudir. Al tocar el logo de la psicóloga se abre WhatsApp con tu resumen listo; tú decides si lo envías.</p>
  ${routes(msg,"Enviar a la psicóloga")}
  <details><summary class="small" style="cursor:pointer;font-weight:700">Ver el mensaje que se enviará</summary><div class="preview" id="pv"></div></details>
  <div class="contact"><span>Si WhatsApp no abre, escribe a <b>${WA_SHOW}</b></span><button class="btn btn-ghost" id="copy" style="padding:10px 16px">Copiar mensaje</button></div>
  <p class="toast" id="toast"></p>
  <p class="small muted">Este resultado es un tamizaje y no reemplaza una valoración profesional.</p>
  <button class="btn btn-ghost" id="again">Hacer la evaluación de nuevo</button>`);
  $("#pv").textContent=msg;
  $("#copy").onclick=()=>{const done=()=>$("#toast").textContent="Mensaje copiado. Pégalo en WhatsApp.";
    try{navigator.clipboard.writeText(msg).then(done,()=>{selectPv()})}catch(e){selectPv()}};
  function selectPv(){$("details").open=true;const r=document.createRange();r.selectNodeContents($("#pv"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("#toast").textContent="Selecciona y copia el mensaje resaltado."}
  $("#again").onclick=()=>{S.ans=Array(16).fill(null);S.func=null;S.riskShown=false;welcome()};
}
welcome();T({paso:1,etapa:"Bienvenida"});
</script>

</body></html>
